name: Lean CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore pinned Mathlib checkout
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanprover-community/mathlib4.git vendor/mathlib
          git -C vendor/mathlib fetch --depth 1 origin 51e6992efd06126df61a496bebf8f49482a4e129
          git -C vendor/mathlib checkout --detach 51e6992efd06126df61a496bebf8f49482a4e129
      - name: Set up Lean
        uses: leanprover/lean-action@v1
      - name: Build Lean project
        run: lake build
      - name: Run Python tests
        run: python3 -m pytest
